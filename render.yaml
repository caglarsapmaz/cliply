services:
  - type: web
    name: cliply
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: YTDLP_TIMEOUT_MS
        value: "120000"
